<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCAPS Hangtag Planner</title>
<script src="../ucaps_shared.js"></script>
<style>
  :root{
    --navy:#1b2a4a; --navy-light:#25396b; --blue:#2f6fed; --blue-dim:#e8f0fe;
    --slate:#5b6472; --slate-light:#8892a0; --bg:#f3f5f8; --panel:#ffffff; --border:#e1e5eb;
    --amber:#b7791f; --amber-bg:#fdf3e0; --green:#1f8a5f; --green-bg:#e5f6ee; --red:#c0392b; --red-bg:#fbe9e7;
    --radius:8px; font-size:15px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--bg);color:#1c2331;}
  header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header .brand{display:flex;align-items:center;gap:12px;}
  header .brand .mark{width:36px;height:36px;border-radius:8px;background:#c9a227;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  header .sub{font-size:12px;color:#aeb9d4;margin-top:2px;}
  nav{display:flex;gap:4px;background:var(--navy-light);padding:0 20px;flex-wrap:wrap;}
  nav button{background:none;border:none;color:#c7d0e6;padding:12px 16px;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;}
  nav button:hover{color:#fff;}
  nav button.active{color:#fff;border-bottom-color:#c9a227;}
  main{padding:22px 24px 60px;max-width:1400px;margin:0 auto;}
  .view{display:none;} .view.active{display:block;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .card .num{font-size:26px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .card .num.sm{font-size:19px;padding-top:5px;}
  .card .lbl{font-size:12.5px;color:var(--slate);margin-top:2px;}
  .card.warn .num{color:var(--amber);} .card.bad .num{color:var(--red);} .card.good .num{color:var(--green);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .panel h2{margin:0 0 4px;font-size:15px;color:var(--navy);}
  .panel .psub{font-size:12.5px;color:var(--slate);margin:0 0 14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:900px){.grid2{grid-template-columns:1fr;}}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar label.inl{font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:6px;}
  .spacer{flex:1;}
  input,select,textarea{font-family:inherit;}
  .toolbar input,.toolbar select{padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  .toolbar input[type=number]{width:72px;}

  button.btn{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  button.btn:hover{background:#245bcf;}
  button.btn.secondary,label.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--border);}
  button.btn.secondary:hover{background:#f2f4f7;}
  button.btn.danger{background:#fff;color:var(--red);border:1px solid #f0c9c3;}
  button.btn.danger:hover{background:var(--red-bg);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  label.btn{display:inline-block;padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;}
  button.btn:disabled{opacity:.5;cursor:default;}

  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:9px 10px;background:#f7f8fa;color:var(--slate);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid #eef0f3;vertical-align:middle;}
  tr:hover td{background:#fafbfd;}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
  tfoot td{font-weight:700;background:#f7f8fa;}
  td input.ci,td select.ci{width:100%;min-width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fff;}
  td input.ci.num{text-align:right;width:90px;min-width:0;}
  td input.ci:focus,td select.ci:focus{outline:2px solid var(--blue-dim);border-color:var(--blue);}
  .muted{color:var(--slate-light);} .small{font-size:11.5px;}
  .code{font-weight:700;color:var(--navy);font-family:ui-monospace,Consolas,monospace;font-size:12.5px;}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;}
  .tag{display:flex;align-items:center;gap:9px;}
  .sw{width:14px;height:26px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none;position:relative;}
  .sw::after{content:"";position:absolute;top:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--bg);border:1px solid rgba(0,0,0,.2);}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
  .chip.good{background:var(--green-bg);color:var(--green);} .chip.warn{background:var(--amber-bg);color:var(--amber);}
  .chip.crit{background:var(--red-bg);color:var(--red);} .chip.muted{background:#eef0f3;color:var(--slate);}
  .chip.info{background:var(--blue-dim);color:var(--blue);}

  .chart{width:100%;}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;}
  .chart text{font-size:11px;fill:var(--slate);font-family:inherit;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--slate);margin-top:6px;}
  .legend i{display:inline-block;width:18px;border-top:2.5px solid;vertical-align:middle;margin-right:6px;}
  .legend i.dash{border-top-style:dashed;}

  .empty{padding:30px 20px;text-align:center;color:var(--slate-light);}
  .note{background:var(--blue-dim);border-radius:6px;padding:10px 14px;font-size:12.5px;color:#23407a;margin-bottom:14px;line-height:1.5;}
  .note.warn{background:var(--amber-bg);color:#7a4f10;}

  /* email preview */
  .email{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .email .hdr{background:#f7f8fa;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.8;}
  .email .hdr b{display:inline-block;min-width:64px;color:var(--slate);font-weight:600;}
  .email .body{padding:16px 18px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:14.5px;line-height:1.45;color:#000;background:#fff;}
  .email .body table{width:auto;border-collapse:collapse;font-size:13.5px;}
  .email .body th,.email .body td{border:1px solid #999;padding:4px 10px;background:#fff;color:#000;text-transform:none;letter-spacing:0;font-size:13.5px;}
  .email .body th{background:#f2f2f2;font-weight:700;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  /* orders */
  .order{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;}
  .order .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .order .ttl{font-weight:700;color:var(--navy);font-size:14.5px;}
  .order .meta{font-size:12.5px;color:var(--slate);margin-top:3px;line-height:1.6;}
  .steps{display:flex;gap:0;margin:12px 0 10px;flex-wrap:wrap;}
  .steps span{font-size:11px;padding:4px 10px;background:#eef0f3;color:var(--slate);border-right:2px solid #fff;font-weight:600;}
  .steps span:first-child{border-radius:12px 0 0 12px;} .steps span:last-child{border-radius:0 12px 12px 0;border-right:none;}
  .steps span.done{background:var(--green-bg);color:var(--green);} .steps span.cur{background:var(--blue);color:#fff;}

  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(15,22,40,.5);align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:10px;max-width:760px;width:100%;padding:24px 26px 26px;}
  .modal h2{margin:0 0 4px;font-size:17px;color:var(--navy);}
  .modal .modal-sub{font-size:12.5px;color:var(--slate);margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .form-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .form-grid .full{grid-column:1/-1;}
  @media (max-width:640px){.form-grid,.form-grid.three{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;}
  .field textarea{resize:vertical;min-height:60px;}
  .field .hint{font-size:11.5px;color:var(--slate-light);margin-top:3px;}
  .modal-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:12px 14px 14px;margin:0 0 14px;}
  legend{font-size:12px;font-weight:700;color:var(--navy);padding:0 6px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;transform:translateY(0);}
  footer.appfoot{text-align:center;color:var(--slate-light);font-size:11.5px;padding:20px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .seg button{background:#fff;border:none;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--slate);border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--navy);color:#fff;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">HT</div>
    <div>
      <h1>UCAPS Hangtag Planner</h1>
      <div class="sub">UCard, Access &amp; Parking Services — Parking hangtag stock, usage &amp; reorders</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <span id="whoami" style="font-size:12px;color:#aeb9d4;"></span>
    <span id="storeMode" style="font-size:11px;color:#aeb9d4;"></span>
  </div>
</header>

<nav id="nav">
  <button class="active" data-view="dashboard">Dashboard</button>
  <button data-view="inventory">Inventory</button>
  <button data-view="planner">Order Planner</button>
  <button data-view="quote">Quote Request</button>
  <button data-view="orders">Orders</button>
  <button data-view="history">Issue History</button>
  <button data-view="settings">Settings</button>
</nav>

<main>
  <div class="view active" id="view-dashboard"></div>
  <div class="view" id="view-inventory"></div>
  <div class="view" id="view-planner"></div>
  <div class="view" id="view-quote"></div>
  <div class="view" id="view-orders"></div>
  <div class="view" id="view-history"></div>
  <div class="view" id="view-settings"></div>
</main>
<footer class="appfoot">UCAPS internal tool · UMass Lowell</footer>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileHist" accept=".xlsx,.csv" style="display:none">
<input type="file" id="fileBackup" accept="application/json,.json" style="display:none">

/* ================= usage model ================= */
function seriesOf(item){ const u = S.usage[item.code]; if (!u || item.basis === 'none') return null; return item.basis === 'all' ? u.a : u.p; }
function histFYs(){ const cur = fyOf(TODAY), n = Math.max(1, +S.settings.histYears || 3); return Array.from({length:n}, (_,i) => cur - n + i); }
function profile(item){
  const s = seriesOf(item), p = new Array(12).fill(0); if (!s) return p;
  const fys = histFYs();
  fys.forEach(fy => { for (let cal = 0; cal < 12; cal++){ const yr = cal >= 6 ? fy-1 : fy; p[cal] += (s[ymKey(yr,cal)] || 0); } });
  return p.map(v => v / fys.length);
}
const annual = item => profile(item).reduce((a,b) => a+b, 0);
function usageBetween(prof, a, b){
  let tot = 0, d = new Date(a);
  while (d < b){ const nx = new Date(d.getFullYear(), d.getMonth()+1, 1); const e = nx < b ? nx : b; tot += prof[d.getMonth()] * ((e - d)/DAY) / D.dim(d); d = e; }
  return tot;
}
function leadDays(){ return (+S.settings.adminWeeks + +S.settings.vendorWeeks) * 7; }
function safetyDays(){ return (+S.settings.safetyMonths || 0) * 30.4; }
function estOnHand(item){
  const c = D.parse(item.countedAt) || TODAY;
  if (c >= TODAY) return +item.onHand || 0;
  return Math.max(0, (+item.onHand || 0) - usageBetween(profile(item), c, TODAY));
}
function openOrders(){ return S.orders.filter(o => !['received','cancelled'].includes(o.status)); }
function expectedArrival(o){ return D.parse(o.expectedDate) || D.addDays(D.parse(o.requestDate) || TODAY, leadDays()); }
function incomingFor(item){
  const arr = [];
  openOrders().forEach(o => o.lines.forEach(l => { if (l.itemId === item.id && +l.qty > 0) arr.push({date: expectedArrival(o), qty:+l.qty, order:o}); }));
  return arr.sort((a,b) => a.date - b.date);
}
/* walk forward month-segment by month-segment; returns run-out date (or null) and monthly points */
function project(item, opts = {}){
  const prof = opts.prof || profile(item);
  let q = opts.start != null ? opts.start : estOnHand(item);
  const arrivals = (opts.arrivals || incomingFor(item)).map(a => ({...a})).sort((a,b) => a.date - b.date);
  const months = opts.months || 24, end = D.addMonths(TODAY, months);
  const pts = [{x:TODAY, y:q}]; let d = new Date(TODAY), runout = null, ai = 0;
  let firstOut = null;
  const applyArr = until => { while (ai < arrivals.length && arrivals[ai].date <= until){ if (q < 0) q = 0; const ad = arrivals[ai].date; if (ad > TODAY && ad <= end) pts.push({x:new Date(ad), y:q}); q += arrivals[ai].qty; if (ad > TODAY && ad <= end) pts.push({x:new Date(ad), y:q}); if (q > 0) runout = null; ai++; } };
  applyArr(d);
  const limit = D.addMonths(TODAY, 72);
  while (d < limit){
    const nx = new Date(d.getFullYear(), d.getMonth()+1, 1);
    const nextArr = ai < arrivals.length ? arrivals[ai].date : null;
    const segEnd = nextArr && nextArr < nx && nextArr > d ? nextArr : nx;
    const rate = prof[d.getMonth()] / D.dim(d), days = (segEnd - d)/DAY;
    if (!runout && rate > 0 && q > 0 && q - rate*days <= 0){ runout = D.addDays(d, Math.max(0, q / rate)); if (!firstOut) firstOut = runout; }
    if (!runout && q <= 0 && rate > 0){ runout = new Date(d); if (!firstOut) firstOut = runout; }
    q -= rate*days; d = segEnd;
    applyArr(d);
    if (d <= end && d.getDate() === 1) pts.push({x:new Date(d), y:Math.max(0,q)});
    if (runout && ai >= arrivals.length && d > end) break;
  }
  return { runout, firstOut, pts };
}
function statusOf(item){
  if (!item.code || item.basis === 'none') return {cls:'muted', txt:'Manual', key:4};
  const yr = annual(item);
  if (yr < 0.5) return {cls:'muted', txt:'No recent use', key:3};
  const pr = project(item);
  if (!pr.runout) return {cls:'good', txt:'OK', key:2, pr};
  const ob = D.addDays(pr.runout, -leadDays() - safetyDays());
  if (ob <= TODAY) return {cls:'crit', txt:'Order now', key:0, pr, ob};
  if (ob <= D.addDays(TODAY, +S.settings.warnDays || 60)) return {cls:'warn', txt:'Order soon', key:1, pr, ob};
  return {cls:'good', txt:'OK', key:2, pr, ob};
}
function monthsOfSupply(item){ const yr = annual(item); if (yr < 0.5) return null; return (estOnHand(item) + incomingFor(item).reduce((a,b) => a+b.qty, 0)) / (yr/12); }
function suggestedQty(item, cover){
  if (!item.code || item.basis === 'none') return 0;
  const yr = annual(item); if (yr < 0.5) return 0;
  cover = cover ?? +S.settings.coverMonths;
  const arrive = D.addDays(TODAY, leadDays());
  const need = usageBetween(profile(item), TODAY, D.addMonths(arrive, cover)) + yr/12*(+S.settings.safetyMonths||0)
    - estOnHand(item) - incomingFor(item).reduce((a,b) => a+b.qty, 0);
  if (need <= 0) return 0;
  const r = Math.max(1, +S.settings.roundTo || 1);
  return Math.max(Math.ceil(need / r) * r, +S.settings.minQty || 0);
}
function nextStart(item){ const n = numOf(item.endNum); return n == null ? null : n + 1; }
function lastIssued(item){ const u = S.usage[item.code]; return u && u.last ? u.last : null; }
function impliedOnHand(item){ const l = lastIssued(item), e = numOf(item.endNum); if (!l || e == null || item.basis !== 'phys') return null; return e - l[0]; }
const basisLabel = b => b === 'all' ? 'all issues' : b === 'phys' ? 'tag #s in stock range' : 'manual';

/* ================= charts (inline SVG) ================= */
function lineChart({series, markers = [], height = 300, yLabel = ''}){
  const W = 1200, H = height, L = 52, R = 14, T = 12, B = 30;
  const xs = series.flatMap(s => s.pts.map(p => +p.x)), ys = series.flatMap(s => s.pts.map(p => p.y));
  if (!xs.length) return '<div class="empty">No data</div>';
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y1 = Math.max(10, ...ys) * 1.08;
  const step = niceStep(y1 / 4); y1 = Math.ceil(y1 / step) * step;
  const X = v => L + (v - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (1 - v / y1) * (H - T - B);
  let g = '';
  for (let v = 0; v <= y1 + 1e-9; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef0f3"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;
  const d0 = new Date(x0); let d = new Date(d0.getFullYear(), d0.getMonth()+1, 1), i = 0;
  while (+d <= x1){ if (d.getMonth() % 3 === 0) g += `<line x1="${X(+d)}" x2="${X(+d)}" y1="${T}" y2="${H-B}" stroke="#f3f4f7"/><text x="${X(+d)}" y="${H-B+16}" text-anchor="middle">${d.toLocaleDateString('en-US',{month:'short'})} ’${String(d.getFullYear()).slice(2)}</text>`; d = new Date(d.getFullYear(), d.getMonth()+1, 1); if (++i > 200) break; }
  markers.forEach(m => { if (+m.x < x0 || +m.x > x1) return; g += `<line x1="${X(+m.x)}" x2="${X(+m.x)}" y1="${T}" y2="${H-B}" stroke="${m.color}" stroke-dasharray="3 3"/><text x="${X(+m.x)+4}" y="${T+10+(m.dy||0)}" style="fill:${m.color};font-weight:600">${esc(m.label)}</text>`; });
  series.forEach(s => { const p = s.pts.map(pt => `${X(+pt.x).toFixed(1)},${Y(pt.y).toFixed(1)}`).join(' '); g += `<polyline points="${p}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`; });
  g += `<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#c9cfd8"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div><div class="legend">${series.map(s => `<span><i class="${s.dash?'dash':''}" style="border-color:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function niceStep(v){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(v,1)))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function hbarChart(rows, {mark, markLabel, max}){
  const W = 760, rowH = 26, L = 150, R = 60, H = rows.length * rowH + 26;
  const mx = max || Math.max(mark || 0, ...rows.map(r => r.v || 0), 1) * 1.05;
  const X = v => L + Math.min(v, mx) / mx * (W - L - R);
  let g = '';
  rows.forEach((r, i) => {
    const y = i * rowH + 4;
    g += `<text x="${L-8}" y="${y+15}" text-anchor="end">${esc(r.label)}</text>`;
    g += `<rect x="${L}" y="${y+3}" width="${Math.max(2, X(r.v||0)-L)}" height="${rowH-9}" rx="3" fill="${r.color}"/>`;
    g += `<text x="${X(r.v||0)+6}" y="${y+15}">${r.v == null ? 'n/a' : (r.v > mx ? '> ' + Math.round(mx) : r.v.toFixed(1)) + ' mo'}</text>`;
  });
  if (mark) g += `<line x1="${X(mark)}" x2="${X(mark)}" y1="0" y2="${H-22}" stroke="#c0392b" stroke-dasharray="4 3"/><text x="${X(mark)}" y="${H-6}" text-anchor="middle" style="fill:#c0392b;font-weight:600">${esc(markLabel)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
function colChart(vals, labels, {color = '#2f6fed', line = null, lineColor = '#c9a227', height = 280}){
  const W = 1200, H = height, L = 44, R = 10, T = 10, B = 30, n = vals.length;
  let y1 = Math.max(5, ...vals, ...(line || [])) * 1.1; const step = niceStep(y1/4); y1 = Math.ceil(y1/step)*step;
  const bw = (W - L - R) / n, Y = v => T + (1 - v / y1) * (H - T - B);
  let g = '';
  for (let v = 0; v <= y1 + 1e-9; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef0f3"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;
  vals.forEach((v, i) => { const x = L + i*bw; g += `<rect x="${x+bw*0.15}" y="${Y(v)}" width="${bw*0.7}" height="${Y(0)-Y(v)}" rx="2" fill="${color}"><title>${esc(labels[i])}: ${fmtN(v)}</title></rect>`; if (n <= 14 || i % Math.ceil(n/12) === 0) g += `<text x="${x+bw/2}" y="${H-B+15}" text-anchor="middle">${esc(labels[i])}</text>`; });
  if (line) g += `<polyline points="${line.map((v,i) => `${L+i*bw+bw/2},${Y(v)}`).join(' ')}" fill="none" stroke="${lineColor}" stroke-width="2.5"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

    </div>
    <div class="panel">
      <h2>Inventory log</h2><p class="psub">Counts, deliveries and adjustments.</p>

        <td class="n">${l.delta != null ? (l.delta>0?'+':'') + fmtN(l.delta) : ''}</td><td class="n">${l.to != null ? fmtN(l.to) : ''}</td><td class="small">${esc(l.note||'')}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No entries yet.</td></tr>'}</tbody></table></div>
    </div>`;
}
function setCount(id, v){

function setField(id, k, v){ const i = itemById(id); i[k] = v; save(); render(); }
function adjustModal(){

    <div class="form-grid">

}

function saveItem(id){

/* ================= ORDER PLANNER ================= */
let planFocus = null;
function planLines(){
  return activeItems().filter(i => +S.plan.qty[i.id] > 0).map(i => {
    const qty = +S.plan.qty[i.id], st = nextStart(i);
    return {itemId:i.id, code:i.code, qty, start:tagNo(i, st), end:st != null ? tagNo(i, st + qty - 1) : '', lastJob:i.jobId, color:i.color, type:i.type, material:i.material};
  });
}
function renderPlan(){
  const el = document.getElementById('view-planner');
  const items = activeItems().filter(i => i.code && i.basis !== 'none');
  const arrive = D.addDays(TODAY, leadDays());
  const lines = planLines(); const totQ = lines.reduce((a,l) => a + l.qty, 0);
  const cost = totQ * (+S.settings.priceEach||0) + (totQ ? +S.settings.freight||0 : 0);
  if (!planFocus || !itemById(planFocus)) planFocus = (lines[0] && lines[0].itemId) || (items[0] && items[0].id);
  el.innerHTML = `
    <div class="panel">
      <div class="toolbar"><div><h2>Order planner</h2><p class="psub" style="margin:0">Enter quantities to see how long each hangtag lasts. An order placed today should arrive about <b>${D.fmt(arrive)}</b> (${S.settings.adminWeeks} wk quote/PO + ${S.settings.vendorWeeks} wk proof, production &amp; freight).</p></div></div>
      <div class="toolbar">
        <label class="inl">Cover <input type="number" id="pCover" min="1" max="60" value="${S.settings.coverMonths}" onchange="S.settings.coverMonths=+this.value||12;save();renderPlan()"> months after arrival</label>
        <button class="btn secondary" onclick="fillSuggested(6)">Fill items due within 6 months</button>
        <button class="btn secondary" onclick="fillSuggested(999)">Fill every suggestion</button>
        <button class="btn secondary" onclick="S.plan.qty={};save();renderPlan()">Clear</button>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Hangtag</th><th class="n">On hand</th><th class="n">Used / yr</th><th>Runs out</th><th>Order by</th><th class="n">Suggested</th><th class="n">Order qty</th><th>Numbers</th><th>Lasts until (with order)</th><th></th></tr></thead>
        <tbody>${items.map(i => {
          const s = statusOf(i), sug = suggestedQty(i), q = +S.plan.qty[i.id] || 0, st = nextStart(i);
          let lasts = '';
          if (q > 0){ const pr = project(i, {arrivals:[...incomingFor(i), {date:arrive, qty:q}], months:72}); lasts = pr.runout ? D.short(pr.runout) : 'beyond 6 yrs'; if (pr.firstOut && pr.firstOut < arrive) lasts += ' <span class="chip crit" title="Current stock runs out before this order would arrive">gap</span>'; }
          return `<tr ${planFocus===i.id?'style="background:#f5f8ff"':''}>
            <td>${tagCell(i)}</td><td class="n">${fmtN(estOnHand(i))}</td><td class="n">${fmtN(annual(i))}</td>
            <td>${s.pr && s.pr.runout ? D.short(s.pr.runout) : (s.pr ? '6+ yrs' : '—')}</td><td>${s.ob ? `<span class="chip ${s.cls}">${D.fmt(s.ob)}</span>` : '—'}</td>
            <td class="n">${sug ? `<a href="#" onclick="setPlan('${i.id}',${sug});return false" title="Use suggestion">${fmtN(sug)}</a>` : '<span class="muted">0</span>'}</td>
            <td class="n"><input class="ci num" type="number" min="0" step="50" value="${q||''}" placeholder="0" onchange="setPlan('${i.id}',this.value)"></td>
            <td class="small mono">${q > 0 && st != null ? esc(tagNo(i,st)) + '–' + esc(tagNo(i, st+q-1)) : ''}</td>
            <td>${lasts}</td>
            <td><button class="btn secondary small" onclick="planFocus='${i.id}';renderPlan()">Chart</button></td></tr>`; }).join('')}</tbody>
        <tfoot><tr><td colspan="6">Total · est. ${fmt$(+S.settings.priceEach)}/tag + ${fmt$(+S.settings.freight)} freight</td><td class="n">${fmtN(totQ)}</td><td colspan="3">${totQ ? 'Est. ' + fmt$(cost) : ''}</td></tr></tfoot>
      </table></div>
      <div class="btnrow"><button class="btn" ${lines.length?'':'disabled'} onclick="toQuote()">Draft quote request for these ${lines.length || ''} →</button></div>
    </div>
    ${planFocus ? planChart(itemById(planFocus), arrive) : ''}`;
}
function planChart(i, arrive){
  const q = +S.plan.qty[i.id] || 0;
  const base = project(i, {months:30});
  const series = [{name:'Current stock' + (incomingFor(i).length ? ' + open orders' : ''), color:'#8892a0', dash:true, pts:base.pts}];
  if (q > 0) series.push({name:`With ${fmtN(q)} more arriving ${D.fmt(arrive)}`, color:'#2f6fed', pts:project(i, {arrivals:[...incomingFor(i), {date:arrive, qty:q}], months:30}).pts});
  const s = statusOf(i), markers = [{x:arrive, label:'arrives', color:'#2f6fed'}];
  if (s.ob) markers.push({x:s.ob, label:'order by', color:'#c0392b', dy:14});
  const p = profile(i);
  return `<div class="panel"><h2>${esc(i.code)} ${esc(i.name)} — projected stock</h2><p class="psub">Seasonal usage, ${fmtN(annual(i))}/yr. Busiest months: ${p.map((v,m) => [v,m]).sort((a,b)=>b[0]-a[0]).slice(0,3).map(([v,m]) => new Date(2000,m,1).toLocaleDateString('en-US',{month:'short'}) + ' (' + fmtN(v) + ')').join(', ')}.</p>
    ${lineChart({series, markers})}</div>`;
}
function setPlan(id, v){ const n = Math.max(0, parseInt(v,10) || 0); if (n) S.plan.qty[id] = n; else delete S.plan.qty[id]; planFocus = id; save(); renderPlan(); }
function fillSuggested(months){
  const win = D.addMonths(TODAY, months);
  activeItems().forEach(i => { const s = statusOf(i), q = suggestedQty(i); if (q > 0 && (months >= 999 || (s.ob && s.ob <= win))) S.plan.qty[i.id] = q; });
  save(); renderPlan();
}
function toQuote(){ S.draft.lines = planLines(); save(); go('quote'); }

/* ================= QUOTE REQUEST ================= */
function draftLines(){
  return S.draft.lines.map(l => {
    const i = itemById(l.itemId) || {};
    const st = l.startOverride || (nextStart(i) != null ? tagNo(i, nextStart(i)) : l.start);
    return {...l, code:i.code || l.code, start:st, end: numOf(st) != null ? tagNo(i, numOf(st) + (+l.qty) - 1) : '', lastJob: l.jobOverride ?? (i.jobId || ''), color:i.color || l.color, type:i.type || l.type, material:i.material || l.material};
  });
}
function quoteEmail(lines){
  const s = S.settings, fy = 'FY' + String(fyOf(TODAY)).slice(2);
  const subject = s.quoteSubject.replace('{FY}', fy);
  const cols = ['Hangtag Code','To Order','Last Job ID','Color','Type','Material','Starting Number'];
  const vals = l => [l.code, fmtN(l.qty), l.lastJob || 'Unknown', l.color, l.type, l.material, l.start];
  const sigH = s.sender.includeSig ? '<br><br>' + esc(s.sender.sig).replace(/\n/g,'<br>') : '';
  const sigT = s.sender.includeSig ? '\n\n' + s.sender.sig : '';
  const html = `<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt">Hi ${esc(s.vendor.contactFirst)},<br><br>${esc(s.quoteIntro)}<br><br>`
    + `<table style="border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt"><thead><tr>${cols.map(c => `<th style="border:1px solid #999;padding:4px 10px;background:#f2f2f2;text-align:left">${c}</th>`).join('')}</tr></thead><tbody>`
    + lines.map(l => `<tr>${vals(l).map((v,k) => `<td style="border:1px solid #999;padding:4px 10px;${k===1?'text-align:right':''}">${esc(v)}</td>`).join('')}</tr>`).join('')
    + `</tbody></table><br>Thank you,<br><br>-${esc(s.sender.first)}${sigH}</div>`;
  const w = cols.map((c,k) => Math.max(c.length, ...lines.map(l => String(vals(l)[k]).length)));
  const row = a => a.map((v,k) => String(v).padEnd(w[k])).join('   ');
  const text = `Hi ${s.vendor.contactFirst},\n\n${s.quoteIntro}\n\n${row(cols)}\n${lines.map(l => row(vals(l))).join('\n')}\n\nThank you,\n\n-${s.sender.first}${sigT}`;
  return {to:s.vendor.to, cc:s.vendor.cc, subject, html, text};
}
function renderQuote(){
  const el = document.getElementById('view-quote');
  const lines = draftLines();
  const used = new Set(lines.map(l => l.itemId));
  const em = quoteEmail(lines);
  const tot = lines.reduce((a,l) => a + (+l.qty), 0);
  el.innerHTML = `
    <div class="panel">
      <h2>Quote request — ${esc(S.settings.vendor.company)}</h2>
      <p class="psub">Lines come from the Order Planner, or add them here. Starting numbers continue from each hangtag's Ending #; Last Job ID tells the printer which artwork to reuse.</p>
      ${lines.length ? `<div class="tablewrap"><table><thead><tr><th>Hangtag</th><th class="n">To order</th><th>Last job ID</th><th>Starting #</th><th>Ending #</th><th></th></tr></thead><tbody>
        ${lines.map((l,k) => { const i = itemById(l.itemId) || l; return `<tr><td>${tagCell(i)}</td>
          <td class="n"><input class="ci num" type="number" min="1" value="${l.qty}" onchange="setLine(${k},'qty',this.value)"></td>
          <td><input class="ci mono" style="width:100px" value="${esc(l.lastJob)}" placeholder="Unknown" onchange="setLine(${k},'jobOverride',this.value.trim())"></td>
          <td><input class="ci mono" style="width:110px" value="${esc(l.start)}" onchange="setLine(${k},'startOverride',this.value.trim().toUpperCase())"></td>
          <td class="mono">${esc(l.end)}</td>
          <td><button class="btn secondary small" onclick="S.draft.lines.splice(${k},1);save();renderQuote()">Remove</button></td></tr>`; }).join('')}
        </tbody><tfoot><tr><td>Total</td><td class="n">${fmtN(tot)}</td><td colspan="4">Est. ${fmt$(tot * +S.settings.priceEach + +S.settings.freight)} at ${fmt$(+S.settings.priceEach)}/tag + freight</td></tr></tfoot></table></div>` : '<div class="empty">No lines yet — add one below or use the Order Planner.</div>'}
      <div class="toolbar" style="margin-top:12px"><select id="addLineSel">${activeItems().filter(i => i.code && !used.has(i.id)).map(i => `<option value="${i.id}">${esc(i.code + ' — ' + i.name)}</option>`).join('')}</select>
        <input type="number" id="addLineQty" value="500" min="1" style="width:90px"><button class="btn secondary" onclick="addLine()">+ Add line</button></div>
    </div>
    ${lines.length ? `<div class="panel">
      <h2>Email</h2><p class="psub">“Copy email” copies the formatted version with the table — paste it into a new Outlook message.</p>
      <div class="email">
        <div class="hdr"><div><b>To</b> ${esc(em.to)}</div><div><b>Cc</b> ${esc(em.cc)}</div><div><b>Subject</b> ${esc(em.subject)}</div></div>
        <div class="body">${em.html}</div>
      </div>
      <div class="btnrow">
        <button class="btn" onclick="copyEmail()">Copy email</button>
        <button class="btn secondary" onclick="copyText(quoteEmail(draftLines()).subject)">Copy subject</button>
        <button class="btn secondary" onclick="copyText(quoteEmail(draftLines()).to + '; ' + quoteEmail(draftLines()).cc)">Copy recipients</button>
        <button class="btn secondary" onclick="mailto()">Open in mail app</button>
        <span class="spacer"></span>
        <button class="btn" style="background:var(--green)" onclick="logRequest()">Log as sent → Orders</button>
      </div></div>` : ''}`;
}
function setLine(k, f, v){ const l = S.draft.lines[k]; if (f === 'qty') l.qty = Math.max(1, parseInt(v,10)||1); else l[f] = v; save(); renderQuote(); }
function addLine(){ const id = val('addLineSel'); if (!id) return; S.draft.lines.push({itemId:id, qty:Math.max(1, parseInt(val('addLineQty'),10)||1)}); save(); renderQuote(); }
async function copyEmail(){
  const em = quoteEmail(draftLines());
  try { await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([em.html],{type:'text/html'}), 'text/plain':new Blob([em.text],{type:'text/plain'})})]); toast('Email copied — paste into Outlook'); return; } catch(e){}
  const box = document.querySelector('.email .body'); const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  try { document.execCommand('copy'); toast('Email copied'); } catch(e){ toast('Select the email and copy manually'); } sel.removeAllRanges();
}
async function copyText(s){ try { await navigator.clipboard.writeText(s); toast('Copied'); } catch(e){ const t = document.createElement('textarea'); t.value = s; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(_){ toast('Copy failed'); } t.remove(); } }
const addrs = s => String(s||'').split(/[;,]/).map(x => (x.match(/<([^>]+)>/) || [,x])[1].trim()).filter(Boolean).join(',');
function mailto(){ const em = quoteEmail(draftLines()); location.href = `mailto:${addrs(em.to)}?cc=${encodeURIComponent(addrs(em.cc))}&subject=${encodeURIComponent(em.subject)}&body=${encodeURIComponent(em.text)}`; }
function logRequest(){
  const lines = draftLines().map(l => ({itemId:l.itemId, code:l.code, qty:+l.qty, start:l.start, end:l.end, lastJob:l.lastJob, color:l.color, type:l.type, material:l.material}));
  if (!lines.length) return;
  S.orders.push({id:uid(), vendor:S.settings.vendor.company, status:'requested', requestDate:D.iso(TODAY), quoteDate:'', estimateNo:'', amount:'', freight:'', poNo:'', invoiceNo:'', invoiceDate:'', jobNo:'', proofDate:'', shipDate:'', expectedDate:'', receivedDate:'', applied:false, lines, notes:''});
  S.draft.lines = []; S.plan.qty = {}; save(); toast('Order logged as requested'); go('orders');
}

/* ================= ORDERS ================= */

        ${o.status==='received' ? `<br>Received ${o.receivedDate ? D.fmt(o.receivedDate) : ''}` : o.status==='cancelled' ? '' : `<br>Expected ${D.fmt(expectedArrival(o))}${o.expectedDate?'':' (est.)'}`}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">

/* ---- xlsx / csv reader (no external libraries) ---- */
async function unzip(buf){
  const dv = new DataView(buf); let eo = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if (eo < 0) throw new Error('Not an .xlsx file');
  const n = dv.getUint16(eo + 10, true); let p = dv.getUint32(eo + 16, true); const files = {};
  for (let k = 0; k < n; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    files[new TextDecoder().decode(new Uint8Array(buf, p + 46, nl))] = {method, csize, lho}; p += 46 + nl + el + cl;
  }
  return { names:Object.keys(files), async text(name){
    const f = files[name]; if (!f) return null;
    const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
    const data = new Uint8Array(buf, start, f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    const st = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(st).arrayBuffer());
  }};
}
const xmlDec = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,'&');
const colIdx = c => { let n = 0; for (const ch of c) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; };
async function readXlsx(buf){
  const z = await unzip(buf);
  const ssx = await z.text('xl/sharedStrings.xml'); const ss = [];
  if (ssx){ const re = /<si>([\s\S]*?)<\/si>/g; let m; while ((m = re.exec(ssx))){ let t = '', r2 = /<t[^>]*>([\s\S]*?)<\/t>/g, q; while ((q = r2.exec(m[1]))) t += q[1]; ss.push(xmlDec(t)); } }
  const sheets = [];
  for (const nm of z.names.filter(n => /^xl\/worksheets\/[^\/]+\.xml$/i.test(n)).sort()){
    const x = await z.text(nm); const rows = [];
    const rr = /<row[^>]*>([\s\S]*?)<\/row>/g; let m;
    while ((m = rr.exec(x))){
      const row = []; const cr = /<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let c;
      while ((c = cr.exec(m[1]))){
        const t = (c[2].match(/t="(\w+)"/) || [])[1]; const inner = c[3] || ''; let v = (inner.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
        if (t === 's') v = ss[+v]; else if (t === 'inlineStr') v = xmlDec((inner.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [,''])[1]); else if (t === 'str' || t === 'e') v = v != null ? xmlDec(v) : v; else if (v != null && t !== 'b') v = +v;
        row[colIdx(c[1])] = v;
      }
      rows.push(row);
    }
    sheets.push(rows);
  }

}
function readCsv(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){ const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ','){ row.push(f); f = ''; } else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += ch; }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }

}
function toDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number'){ if (v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * DAY)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); } return null; }
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) return new Date(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[1]-1, +m[2]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1], +m[2]-1, +m[3]);

}
/* find Issue date / Decal Code / Decal Number columns; the T2 export's header row sits one column off from its data, so verify against the data itself */
function extractRecords(rows){
  const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z]/g,'');
  let h = -1, ci = -1, ni = -1, di = -1;
  for (let r = 0; r < Math.min(40, rows.length); r++){
    const row = rows[r] || []; const n = row.map(norm);
    const c = n.indexOf('decalcode'), nu = n.indexOf('decalnumber');
    if (c >= 0 && nu >= 0){ h = r; ci = c; ni = nu; di = n.findIndex(x => x === 'issuedate'); break; }
  }
  if (h < 0) return null;
  const sample = rows.slice(h + 1, h + 400);
  let best = {score:-1, off:0};
  [0,-1,1].forEach(off => { let sc = 0; sample.forEach(r => { if (!r) return; const c = String(r[ci+off] ?? '').trim(), nmb = String(r[ni+off] ?? '').trim().toUpperCase(); if (c && /^[A-Z]{1,6}$/.test(c) && nmb.startsWith(c)) sc++; }); if (sc > best.score) best = {score:sc, off}; });
  const off = best.off; let dcol = di >= 0 ? di + off : -1;
  const dScore = col => sample.filter(r => r && toDate(r[col])).length;
  if (dcol < 0 || dScore(dcol) < sample.length * 0.5){ let bc = -1, bs = 0; for (let k = 0; k < 20; k++){ const s = dScore(k); if (s > bs){ bs = s; bc = k; } } dcol = bc; }
  const recs = [];
  for (let r = h + 1; r < rows.length; r++){
    const row = rows[r]; if (!row) continue;
    const date = toDate(row[dcol]), code = String(row[ci+off] ?? '').trim().toUpperCase(), num = String(row[ni+off] ?? '').trim().toUpperCase();
    if (date && code) recs.push({date, code, num});
  }
  return {recs, score:best.score};
}
document.getElementById('fileHist').addEventListener('change', async e => {

    let best = null; sheets.forEach(rows => { const x = extractRecords(rows); if (x && (!best || x.recs.length > best.recs.length)) best = x; });
    if (!best || !best.recs.length) throw new Error('Couldn\'t find Issue Date, Decal Code and Decal Number columns in this file.');

function buildUsage(recs){
  recs.sort((a,b) => a.date - b.date || a.num.localeCompare(b.num));
  const out = {}, codes = new Set(S.items.filter(i => i.code).map(i => i.code));
  const other = {};
  S.items.filter(i => i.code).forEach(i => { if (!out[i.code]) out[i.code] = {p:{}, a:{}, last:null, end:numOf(i.endNum), seen:new Set(), iss:[]}; });
  recs.forEach(r => {
    const o = out[r.code]; if (!o){ other[r.code] = (other[r.code]||0) + 1; return; }
    const k = ymKey(r.date.getFullYear(), r.date.getMonth()); o.a[k] = (o.a[k]||0) + 1;
    const m = r.num.match(new RegExp('^' + r.code + '(\\d+)$'));
    if (m){ const n = +m[1]; if (o.end == null || n <= o.end){ if (!o.seen.has(n)){ o.seen.add(n); o.p[k] = (o.p[k]||0) + 1; } o.iss.push([r.date, n]); } }
  });
  Object.values(out).forEach(o => { if (o.iss.length){ const ld = o.iss[o.iss.length-1][0]; let best = null; o.iss.forEach(([d,n]) => { if ((ld - d)/DAY <= 120 && (!best || n > best[0])) best = [n, D.iso(d)]; }); o.last = best; } delete o.seen; delete o.iss; delete o.end; });

function previewImport(recs, name){

  const fyT = (ser, fy) => Object.entries(ser).reduce((t,[k,v]) => { const [y,m] = k.split('-').map(Number); return t + (((m >= 7 ? y+1 : y) === fy) ? v : 0); }, 0);
  window._pendingImport = {out, meta:{source:name, from:D.iso(from), to:D.iso(to), rows:recs.length, importedAt:D.iso(TODAY)}};
  const items = S.items.filter(i => i.code);
  openModal(`<h2>Import issue history</h2><div class="modal-sub">${esc(name)} · ${fmtN(recs.length)} records · ${D.fmt(from)} – ${D.fmt(to)}. Hangtag counts below use each hangtag's “usage from” setting.</div>
    <div class="tablewrap"><table><thead><tr><th>Code</th>${fys.map(fy => `<th class="n">FY${String(fy).slice(2)}</th>`).join('')}<th>Last tag # issued</th></tr></thead><tbody>
    ${items.map(i => { const o = out[i.code], ser = i.basis === 'all' ? o.a : o.p; return `<tr><td class="code">${esc(i.code)}</td>${fys.map(fy => `<td class="n">${fmtN(fyT(ser,fy))}</td>`).join('')}<td class="mono">${o.last ? esc(tagNo(i,o.last[0])) + ' <span class="muted">' + D.fmt(o.last[1]) + '</span>' : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="psub" style="margin-top:10px">${Object.keys(other).length} other permit codes (decals, virtual permits) are ignored. Months from ${D.short(from)} through ${D.short(to)} will be replaced; earlier months are kept.</p>
    <div class="modal-footer"><span></span><div><button class="btn secondary" onclick="closeModal()">Cancel</button> <button class="btn" onclick="applyImport()">Import</button></div></div>`);
}
function applyImport(){
  const {out, meta} = window._pendingImport; const lo = meta.from.slice(0,7), hi = meta.to.slice(0,7);
  Object.entries(out).forEach(([code, o]) => {
    const cur = S.usage[code] || {p:{}, a:{}, last:null};
    ['p','a'].forEach(b => { Object.keys(cur[b]).forEach(k => { if (k >= lo && k <= hi) delete cur[b][k]; }); Object.assign(cur[b], o[b]); });
    if (o.last) cur.last = o.last;
    S.usage[code] = cur;
  });
  S.usageMeta = meta; window._pendingImport = null; save(); closeModal(); render(); toast('Issue history imported');
}

/* ================= SETTINGS ================= */
function renderSettings(){
  const s = S.settings, el = document.getElementById('view-settings');
  const inp = (path, label, type='text', hint='', extra='') => `<div class="field"><label>${label}</label><input type="${type}" value="${esc(getP(path))}" onchange="setP('${path}', this.${type==='checkbox'?'checked':'value'}, '${type}')" ${type==='number'?'step="any"':''} ${extra}>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
  el.innerHTML = `
    <div class="panel"><h2>Vendor &amp; quote email</h2><p class="psub">Used to draft the quote request on the Quote Request tab.</p>
      <div class="form-grid">
        ${inp('vendor.company','Vendor')}${inp('vendor.contactFirst','Greeting name')}
        ${inp('vendor.to','To')}${inp('vendor.cc','Cc','text','Separate with semicolons')}
        ${inp('vendor.customerNo','Customer #')}${inp('vendor.phone','Vendor phone')}
        <div class="field full">${inp('quoteSubject','Subject','text','{FY} becomes the current fiscal year, e.g. FY27')}</div>
        <div class="field full"><label>Opening paragraph</label><textarea onchange="setP('quoteIntro',this.value)">${esc(s.quoteIntro)}</textarea></div>
        ${inp('sender.first','Sign-off name')}
        <div class="field"><label>&nbsp;</label><label style="font-weight:400"><input type="checkbox" ${s.sender.includeSig?'checked':''} onchange="setP('sender.includeSig',this.checked,'checkbox')" style="width:auto"> Add signature block (leave off if Outlook adds yours)</label></div>
        <div class="field full"><label>Signature block</label><textarea onchange="setP('sender.sig',this.value)">${esc(s.sender.sig)}</textarea></div>
        <div class="field full"><label>Hangtag spec (for reference)</label><textarea onchange="setP('spec',this.value)">${esc(s.spec)}</textarea></div>
      </div></div>
    <div class="panel"><h2>PO request</h2><p class="psub">The person who opens POs for quotes.</p>
      <div class="form-grid">${inp('po.first','Name')}${inp('po.to','Email')}</div></div>
    <div class="panel"><h2>Planning</h2>
      <div class="form-grid three">
        ${inp('adminWeeks','Quote + PO time (weeks)','number')}${inp('vendorWeeks','Vendor lead time (weeks)','number','Proof 2–4 working days + production 25–30 working days + freight')}
        ${inp('safetyMonths','Safety stock (months)','number')}
        ${inp('coverMonths','Order covers (months after arrival)','number')}${inp('warnDays','“Order soon” window (days)','number')}
        ${inp('histYears','Forecast from last N full fiscal years','number','',`min="1" max="6"`)}
        ${inp('roundTo','Round order qty up to','number')}${inp('minQty','Minimum line qty','number')}
        ${inp('priceEach','Est. price per tag ($)','number','Updates from each received order (FY26: $3,390.74 ÷ 1,400)')}
        ${inp('freight','Est. freight per order ($)','number')}
      </div></div>
    <div class="panel"><h2>Data</h2><p class="psub">${HOSTED ? 'Saved to the shared UCAPS Tools database — everyone signed in sees the same data.' : 'Saved in this browser only. Export a backup to move it to another computer.'}</p>
      <div class="btnrow"><button class="btn secondary" onclick="exportJSON()">Export backup (.json)</button><button class="btn secondary" onclick="document.getElementById('fileBackup').click()">Import backup…</button><button class="btn danger" onclick="resetAll()">Reset to starting data</button></div></div>`;
}
function getP(path){ return path.split('.').reduce((o,k) => o == null ? o : o[k], S.settings); }
function setP(path, v, type){ const ks = path.split('.'); let o = S.settings; for (let i = 0; i < ks.length-1; i++) o = o[ks[i]]; o[ks[ks.length-1]] = type === 'number' ? (v === '' ? 0 : +v) : v; save(); toast('Saved'); }
function exportJSON(){ const b = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'hangtag-planner-backup-' + D.iso(TODAY) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
document.getElementById('fileBackup').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.items || !d.settings) throw new Error('Not a Hangtag Planner backup'); if (!confirmBox('Replace all current data with this backup?')) return; S = normalize(d); save(); render(); toast('Backup restored'); } catch(err){ alertModal('Import failed', err.message); }
});
function resetAll(){ if (!confirmBox('Reset everything to the starting data? This replaces counts, orders and history.')) return; S = defaults(); save(); render(); toast('Reset'); }

/* ================= modal ================= */
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalBg').classList.add('active'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }
document.getElementById('modalBg').addEventListener('mousedown', e => { if (e.target.id === 'modalBg') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function alertModal(t, m){ openModal(`<h2>${esc(t)}</h2><p>${esc(m)}</p><div class="modal-footer"><span></span><button class="btn" onclick="closeModal()">OK</button></div>`); }
function confirmBox(m){ return window.confirm(m); }
const val = id => (document.getElementById(id) || {}).value ?? '';

/* ================= boot ================= */
function normalize(d){
  const def = defaults();
  d.settings = Object.assign(def.settings, d.settings || {});
  ['vendor','sender','po'].forEach(k => d.settings[k] = Object.assign(defaultSettings()[k], d.settings[k] || {}));
  d.items = d.items || def.items; d.ledger = d.ledger || []; d.usage = d.usage || def.usage; d.usageMeta = d.usageMeta || def.usageMeta;
  d.orders = d.orders || []; d.draft = d.draft || {lines:[]}; d.plan = d.plan || {qty:{}};
  return d;
}
(async function boot(){
  document.getElementById('storeMode').textContent = HOSTED ? '· shared data' : '· saved in this browser';
  document.getElementById('view-dashboard').innerHTML = '<div class="empty">Loading…</div>';
  const d = await storeGet();
  S = d ? normalize(d) : defaults();
  if (!d) storeSet(S);
  render();
})();
</script>
</body>
