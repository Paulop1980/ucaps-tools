<script>
  // Password gate (from ucaps_shared.js)
  if (typeof ucapsGate === "function") ucapsGate();

  // ── window.storage shim → Supabase ──────────────────────────────
  // The app was written for the Claude artifact storage API. We redirect
  // those same calls to the shared Supabase db so data syncs across devices.
  window.storage = {
    async get(key) {
      try {
        const val = await db.get(key);
        return val != null ? { value: typeof val === "string" ? val : JSON.stringify(val) } : null;
      } catch (e) { return null; }
    },
    async set(key, value) {
      try {
        // value comes in already JSON-stringified from the app
        const parsed = typeof value === "string" ? JSON.parse(value) : value;
        await db.set(key, parsed);
      } catch (e) {
        await db.set(key, value);
      }
    }
  };
</script>

const CAMPUS_ORDER = ["East", "North", "South", "ICC", "Off Campus", "Other"];

// ---- storage helpers (artifact persistent storage) ----
const KEY = "ucaps_ep_results_v1";
const CYCLE_KEY = "ucaps_ep_cycle_v1";
async function loadCycle() {
  try { const r = await window.storage.get(CYCLE_KEY); return r && r.value ? JSON.parse(r.value) : null; }
  catch (e) { return null; }
}
async function saveCycle(obj) { try { await window.storage.set(CYCLE_KEY, JSON.stringify(obj)); } catch (e) {} }
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthLabel(iso) { if (!iso) return ""; const [y, m] = iso.split("-"); return `${MONTHS[parseInt(m,10)-1]} ${y}`; }
async function loadResults() {
  try {
    const r = await window.storage.get(KEY);
    return r && r.value ? JSON.parse(r.value) : {};
  } catch (e) {
    return {};
  }
}
async function saveResults(obj) {
  try {
    await window.storage.set(KEY, JSON.stringify(obj));
  } catch (e) {}
}

const todayISO = () => {
  const d = new Date();
  return d.toISOString().slice(0, 10);
};
const fmtDate = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${m}/${d}/${y}`;
};

// overall status for a phone given its result record
function statusOf(rec) {
  if (!rec || !rec.lastTested) return "untested";
  const core = [rec.button, rec.mic, rec.speaker];
  const anyFail = core.some((v) => v === "Not Working") || rec.lights === "No";
  if (anyFail) return "fail";
  return "pass";
}

const STATUS_META = {
  untested: { label: "Not Tested", color: "#9aa3ad", bg: "#eef0f2" },
  pass: { label: "Pass", color: "#1a7d3c", bg: "#e3f4e8" },
  fail: { label: "Needs Attention", color: "#c0392b", bg: "#fbe6e3" },
};

function App() {
  const [screen, setScreen] = useState("start"); // start | list | detail | export
  const [results, setResults] = useState({});
  const [cycleStart, setCycleStart] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [selId, setSelId] = useState(null);
  const [search, setSearch] = useState("");
  const [campus, setCampus] = useState("All");
  const [statusFilter, setStatusFilter] = useState("all"); // all | untested | pass | fail
  const [sortBy, setSortBy] = useState("order"); // order | name | recent

  useEffect(() => {
    document.title = "UCAPS Emergency Phone Testing";
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap";
    document.head.appendChild(link);
    (async () => {
      setResults(await loadResults());
      const c = await loadCycle();
      setCycleStart(c && c.start ? c.start : null);
      setLoaded(true);
    })();
    // Live refresh: pick up results entered on other devices / via admin import.
    const iv = setInterval(async () => {
      try {
        if (typeof db === "undefined") return;
        const remote = await db.get("ucaps_ep_results_v1");
        if (remote) setResults(remote);
      } catch (e) {}
    }, 20000);
    return () => clearInterval(iv);
  }, []);

  const persist = (next) => {
    setResults(next);
    saveResults(next);
  };
  const startNewCycle = () => {
    const t = todayISO();
    persist({});
    setCycleStart(t);
    saveCycle({ start: t });
  };

  const campuses = useMemo(() => {
    const set = new Set(PHONES.map((p) => p.campus));
    return ["All", ...CAMPUS_ORDER.filter((c) => set.has(c))];
  }, []);

  const stats = useMemo(() => {
    let tested = 0, pass = 0, fail = 0;
    PHONES.forEach((p) => {
      const s = statusOf(results[p.id]);
      if (s !== "untested") tested++;
      if (s === "pass") pass++;
      if (s === "fail") fail++;
    });
    return { total: PHONES.length, tested, pass, fail, remaining: PHONES.length - tested };
  }, [results]);

  const filtered = useMemo(() => {
    let list = PHONES.filter((p) => {
      if (campus !== "All" && p.campus !== campus) return false;
      const s = statusOf(results[p.id]);
      if (statusFilter !== "all" && s !== statusFilter) return false;
      if (search.trim()) {
        const q = search.toLowerCase();
        const hay = `${p.loc} ${p.building} ${p.ext} ${p.campus} ${p.brand}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    if (sortBy === "name") list = [...list].sort((a, b) => a.loc.localeCompare(b.loc));
    else if (sortBy === "recent")
      list = [...list].sort((a, b) => {
        const ra = results[a.id]?.lastTested || "";
        const rb = results[b.id]?.lastTested || "";
        return rb.localeCompare(ra);
      });
    else list = [...list].sort((a, b) => a.seq - b.seq);
    return list;
  }, [search, campus, statusFilter, sortBy, results]);

  const openPhone = (id) => {
    setSelId(id);
    setScreen("detail");
  };

  const selPhone = PHONES.find((p) => p.id === selId);
  const selIndexInFiltered = filtered.findIndex((p) => p.id === selId);

  const saveRecord = (id, rec, advance) => {
    const next = { ...results, [id]: rec };
    persist(next);
    if (advance) {
      // find next untested in current filtered order after this one
      const startIdx = filtered.findIndex((p) => p.id === id);
      let target = null;
      for (let i = startIdx + 1; i < filtered.length; i++) {
        if (statusOf(next[filtered[i].id]) === "untested") { target = filtered[i]; break; }
      }
      if (!target) {
        for (let i = startIdx + 1; i < filtered.length; i++) { target = filtered[i]; break; }
      }
      if (target) { setSelId(target.id); }
      else setScreen("list");
    } else {
      setScreen("list");
    }
  };

  if (!loaded) {
    return (
      <div style={{ ...wrap, alignItems: "center", justifyContent: "center", color: "#fff" }}>
        <div style={{ fontFamily: "'Public Sans',sans-serif", opacity: 0.8 }}>Loading…</div>
      </div>
    );
  }

  return (
    <div style={wrap}>
      <div style={phoneFrame}>
        {screen === "start" && (
          <StartScreen stats={stats} cycleStart={cycleStart} onStart={() => setScreen("list")} onExport={() => setScreen("export")} />
        )}
        {screen === "list" && (
          <ListScreen
            phones={filtered}
            results={results}
            search={search} setSearch={setSearch}
            campus={campus} setCampus={setCampus} campuses={campuses}
            statusFilter={statusFilter} setStatusFilter={setStatusFilter}
            sortBy={sortBy} setSortBy={setSortBy}
            stats={stats}
            onOpen={openPhone}
            onHome={() => setScreen("start")}
            onExport={() => setScreen("export")}
          />
        )}
        {screen === "detail" && selPhone && (
          <DetailScreen
            key={selPhone.id}
            phone={selPhone}
            rec={results[selPhone.id]}
            position={selIndexInFiltered >= 0 ? `${selIndexInFiltered + 1} of ${filtered.length}` : ""}
            onBack={() => setScreen("list")}
            onSave={saveRecord}
          />
        )}
        {screen === "export" && (
          <ExportScreen
            results={results} stats={stats}
            cycleStart={cycleStart}
            onBack={() => setScreen("list")}
            onNewCycle={startNewCycle}
          />
        )}
      </div>
    </div>
  );
}

// ---------- Start ----------
function StartScreen({ stats, cycleStart, onStart, onExport }) {
  const pct = stats.total ? Math.round((stats.tested / stats.total) * 100) : 0;
  const cycleAge = cycleStart ? Math.floor((Date.now() - new Date(cycleStart).getTime()) / 86400000) : null;
  const cycleDue = cycleAge != null && cycleAge >= 30;
  return (
    <div style={{ ...screenCol, background: NAVY }}>
      <div style={{ position: "relative", height: 230, overflow: "hidden", flexShrink: 0 }}>
        <div style={{
          position: "absolute", inset: 0,
          background: `linear-gradient(135deg, ${NAVY_DARK}, ${NAVY})`,
        }} />
        <div style={{ position: "absolute", inset: 0, opacity: 0.12,
          backgroundImage: `repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 16px)` }} />
        <div style={{ position: "relative", padding: "28px 26px", color: "#fff" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ background: "#fff", borderRadius: 11, padding: "10px 13px", flexShrink: 0, boxShadow: "0 2px 8px rgba(0,0,0,.18)" }}>
              <UMLLogo variant="full" height={52} />
            </div>
            <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 700, fontSize: 12.5, letterSpacing: 1.8, color: GOLD, lineHeight: 1.35 }}>
              UCAPS &amp;<br />INTEGRATED<br />SECURITY
            </div>
          </div>
          <h1 style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 38, lineHeight: 1.02, margin: "26px 0 0" }}>
            Emergency<br />Phone Testing
          </h1>
        </div>
      </div>

      <div style={{ flex: 1, background: "#f4f6f8", borderTopLeftRadius: 22, borderTopRightRadius: 22, marginTop: -16, padding: "24px 22px", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <span style={{ fontFamily: "'Public Sans',sans-serif", fontWeight: 700, color: NAVY, fontSize: 15 }}>This cycle's progress</span>
          <span style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, color: NAVY, fontSize: 15 }}>{pct}%</span>
        </div>
        <div style={{ height: 12, background: "#e2e6ea", borderRadius: 99, overflow: "hidden" }}>
          <div style={{ width: `${pct}%`, height: "100%", background: `linear-gradient(90deg, ${GOLD}, #ffcb47)`, transition: "width .4s" }} />
        </div>
        {cycleStart ? (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>
            <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: "#7a838c", fontWeight: 600 }}>Cycle: {monthLabel(cycleStart)}</span>
            <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: cycleDue ? "#c0392b" : "#9aa3ad", fontWeight: 600 }}>{cycleAge === 0 ? "Started today" : `Day ${cycleAge + 1}`}</span>
          </div>
        ) : (
          <div style={{ marginTop: 10, fontFamily: "'Public Sans',sans-serif", fontSize: 12, color: "#9aa3ad" }}>No monthly cycle marked yet — start one from Summary &amp; Export.</div>
        )}
        {cycleDue && (
          <div style={{ marginTop: 12, background: "#fff7e6", border: "1px solid #f5d98a", borderRadius: 12, padding: "11px 14px", display: "flex", gap: 10, alignItems: "center" }}>
            <span style={{ fontSize: 18 }}>⟳</span>
            <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: "#8a6d1a", lineHeight: 1.4 }}>It's been {cycleAge} days since this cycle began — time for a new monthly round. Start one from <strong>Summary &amp; Export</strong>.</span>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, margin: "20px 0 4px" }}>
          <Stat n={stats.tested} label="Tested" color={NAVY} />
          <Stat n={stats.remaining} label="Remaining" color="#5b6670" />
          <Stat n={stats.pass} label="Passing" color="#1a7d3c" />
          <Stat n={stats.fail} label="Needs Attention" color="#c0392b" />
        </div>

        <button onClick={onStart} style={primaryBtn}>
          {stats.tested > 0 ? "Continue Testing" : "Start Testing"}
        </button>
        <button onClick={onExport} style={ghostBtn}>
          View Summary &amp; Export
        </button>
        <p style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12, color: "#8a939c", textAlign: "center", marginTop: 18, lineHeight: 1.5 }}>
          {stats.total} phones across all campuses. Results save automatically on this device.
        </p>
      </div>
    </div>
  );
}

function Stat({ n, label, color }) {
  return (
    <div style={{ background: "#fff", borderRadius: 14, padding: "14px 16px", boxShadow: "0 1px 3px rgba(0,0,0,.06)" }}>
      <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 30, color, lineHeight: 1 }}>{n}</div>
      <div style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12, color: "#7a838c", marginTop: 4, fontWeight: 600 }}>{label}</div>
    </div>
  );
}

    <div style={screenCol}>
      <TopBar title="Emergency Phones" onHome={onHome} right={
        <button onClick={onExport} style={iconBtn} aria-label="Export">↧</button>
      } />
      <div style={{ background: NAVY, padding: "0 14px 14px" }}>
        <div style={{ display: "flex", alignItems: "center", background: "#fff", borderRadius: 12, padding: "0 12px" }}>
          <span style={{ color: "#9aa3ad", fontSize: 18 }}>⌕</span>
          <input
            value={search} onChange={(e) => setSearch(e.target.value)}

                  </span>
                  <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 11, color: "#8a939c", fontWeight: 600 }}>

                </div>

                  {p.loc}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 11.5, fontWeight: 700, color: m.color, background: m.bg, padding: "2px 9px", borderRadius: 99 }}>
                    {m.label}
                  </span>
                  {rec?.lastTested && (
                    <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 11.5, color: "#9aa3ad" }}>
                      {fmtDate(rec.lastTested)}

        <div style={{ height: 20 }} />
      </div>

}

// ---------- Detail ----------
const OPT3 = ["Working", "Not Working", "N/A"];
const OPT_YN = ["Yes", "No", "N/A"];

function DetailScreen({ phone, rec, position, onBack, onSave }) {
  const [button, setButton] = useState(rec?.button || null);
  const [mic, setMic] = useState(rec?.mic || null);
  const [speaker, setSpeaker] = useState(rec?.speaker || null);
  const [lights, setLights] = useState(rec?.lights || null);
  const [notes, setNotes] = useState(rec?.notes || "");
  const scrollRef = useRef(null);

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [phone.id]);

  const build = () => ({
    button, mic, speaker, lights, notes: notes.trim(),
    lastTested: todayISO(),
  });

  return (
    <div style={screenCol}>
      <TopBar title={`Testing · ${String(phone.seq).padStart(4, "0")}`} onBack={onBack}
        right={position ? <span style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: "rgba(255,255,255,.85)" }}>{position}</span> : null} />

      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", background: "#f4f6f8" }}>
        {/* location header card */}
        <div style={{ background: "#fff", padding: "18px 20px", borderBottom: "1px solid #e8ebee" }}>
          <div style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 11.5, fontWeight: 700, letterSpacing: 1, color: GOLD, textTransform: "uppercase" }}>
            {phone.campus}{phone.intext ? " · " + phone.intext : ""}
          </div>
          <h2 style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 23, color: NAVY, margin: "4px 0 12px", lineHeight: 1.12 }}>
            {phone.loc}
          </h2>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {phone.building && <Meta label="Building" value={phone.building + (phone.floor ? " / " + phone.floor : "")} />}
            {phone.ext && <Meta label="Dial / Ext" value={phone.ext} />}
            {phone.brand && <Meta label="Brand" value={phone.brand} />}
            {phone.model && <Meta label="Model" value={phone.model} />}
            {phone.conn && <Meta label="Connectivity" value={phone.conn} />}
          </div>
          {phone.notes && (
            <div style={{ marginTop: 12, fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: "#6b747d", background: "#f4f6f8", padding: "8px 11px", borderRadius: 8, lineHeight: 1.4 }}>
              <strong style={{ color: NAVY }}>Install note:</strong> {phone.notes}
            </div>
          )}
        </div>

        <div style={{ padding: "8px 18px 18px" }}>
          <Field label="Button / Dialing" options={OPT3} value={button} onChange={setButton} />
          <Field label="Microphone" options={OPT3} value={mic} onChange={setMic} />
          <Field label="Speaker" options={OPT3} value={speaker} onChange={setSpeaker} />
          <Field label="Blue Light / Strobe" options={OPT_YN} value={lights} onChange={setLights} />

          <div style={{ marginTop: 16 }}>
            <label style={fieldLabel}>Testing Notes</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)}
              placeholder="Any issues, work orders, follow-up needed…"
              rows={3}
              style={{ width: "100%", boxSizing: "border-box", border: "1.5px solid #d8dde2", borderRadius: 12, padding: "12px 14px", fontFamily: "'Public Sans',sans-serif", fontSize: 14.5, outline: "none", resize: "vertical" }} />
          </div>
          {rec?.lastTested && (
            <div style={{ marginTop: 10, fontFamily: "'Public Sans',sans-serif", fontSize: 12, color: "#9aa3ad" }}>
              Last saved {fmtDate(rec.lastTested)}
            </div>
          )}
        </div>
      </div>

      <div style={{ padding: "12px 16px", background: "#fff", borderTop: "1px solid #e8ebee", display: "flex", gap: 10 }}>
        <button onClick={() => onSave(phone.id, build(), false)} style={{ ...secondaryBtn, flex: 1 }}>Save</button>
        <button onClick={() => onSave(phone.id, build(), true)} style={{ ...primaryBtnSm, flex: 1.4 }}>Save &amp; Next →</button>
      </div>
    </div>
  );
}

function Meta({ label, value }) {
  return (
    <div style={{ background: "#f4f6f8", borderRadius: 9, padding: "6px 11px" }}>
      <div style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 10, color: "#9aa3ad", fontWeight: 700, textTransform: "uppercase", letterSpacing: .5 }}>{label}</div>
      <div style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 13.5, color: "#2c333a", fontWeight: 600 }}>{value}</div>
    </div>
  );
}

function Field({ label, options, value, onChange }) {
  return (
    <div style={{ marginTop: 16 }}>
      <label style={fieldLabel}>{label}</label>
      <div style={{ display: "flex", gap: 8 }}>
        {options.map((opt) => {
          const active = value === opt;
          const good = opt === "Working" || opt === "Yes";
          const bad = opt === "Not Working" || opt === "No";
          let activeBg = NAVY, activeFg = "#fff";
          if (active && good) { activeBg = "#1a7d3c"; }
          if (active && bad) { activeBg = "#c0392b"; }
          if (active && opt === "N/A") { activeBg = "#5b6670"; }
          return (
            <button key={opt} onClick={() => onChange(active ? null : opt)} style={{
              flex: 1, padding: "13px 6px", borderRadius: 12, cursor: "pointer",
              fontFamily: "'Public Sans',sans-serif", fontWeight: 700, fontSize: 14,
              border: active ? "1.5px solid transparent" : "1.5px solid #d8dde2",
              background: active ? activeBg : "#fff",
              color: active ? activeFg : "#5b6670",
              transition: "all .12s",
            }}>{opt}</button>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Export / Summary ----------
function ExportScreen({ results, stats, cycleStart, onBack, onNewCycle }) {
  const [copied, setCopied] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  const buildCSV = () => {
    const headers = ["Seq","Location Description","Campus","Building","Interior/Exterior","Extension","Brand","Last Tested","Button/Dialing","Mic","Speaker","Lights","Status","Testing Notes"];
    const lines = [headers.join(",")];
    PHONES.forEach((p) => {
      const r = results[p.id] || {};
      const s = statusOf(r);
      const row = [
        p.seq, p.loc, p.campus, p.building, p.intext, p.ext, p.brand,
        r.lastTested ? fmtDate(r.lastTested) : "",
        r.button || "", r.mic || "", r.speaker || "", r.lights || "",
        STATUS_META[s].label, r.notes || "",
      ].map((v) => {
        const str = String(v ?? "");
        return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
      });
      lines.push(row.join(","));
    });
    return lines.join("\n");
  };

  const download = () => {
    const csv = buildCSV();
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Emergency_Phone_Testing_${todayISO()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(buildCSV());
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch (e) {}
  };

  const failing = PHONES.filter((p) => statusOf(results[p.id]) === "fail");

  return (
    <div style={screenCol}>
      <TopBar title="Summary &amp; Export" onBack={onBack} />
      <div style={{ flex: 1, overflowY: "auto", background: "#f4f6f8", padding: "18px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <Stat n={stats.tested + "/" + stats.total} label="Tested" color={NAVY} />
          <Stat n={stats.fail} label="Needs Attention" color="#c0392b" />
        </div>

        {failing.length > 0 && (
          <div style={{ marginTop: 18 }}>
            <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 700, color: NAVY, fontSize: 15, marginBottom: 8 }}>
              Phones needing attention
            </div>
            {failing.map((p) => {
              const r = results[p.id];
              const issues = [];
              if (r.button === "Not Working") issues.push("Button");
              if (r.mic === "Not Working") issues.push("Mic");
              if (r.speaker === "Not Working") issues.push("Speaker");
              if (r.lights === "No") issues.push("Light");
              return (
                <div key={p.id} style={{ background: "#fff", borderLeft: "4px solid #c0392b", borderRadius: 8, padding: "10px 13px", marginBottom: 8 }}>
                  <div style={{ fontFamily: "'Public Sans',sans-serif", fontWeight: 700, fontSize: 14, color: "#222" }}>{p.loc}</div>
                  <div style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: "#c0392b", marginTop: 2 }}>
                    {issues.join(", ")}{r.notes ? " — " + r.notes : ""}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{ marginTop: 22 }}>
          <button onClick={download} style={primaryBtn}>Download CSV</button>
          <button onClick={copy} style={ghostBtn}>{copied ? "Copied to clipboard ✓" : "Copy CSV to clipboard"}</button>
        </div>

        <div style={{ marginTop: 28, borderTop: "1px solid #e2e6ea", paddingTop: 18 }}>
          <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 700, color: NAVY, fontSize: 15, marginBottom: 4 }}>Monthly testing cycle</div>
          <p style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 12.5, color: "#8a939c", margin: "0 0 12px", lineHeight: 1.5 }}>
            {cycleStart ? `Current cycle started ${fmtDate(cycleStart)}. ` : "No cycle marked yet. "}Starting a new cycle marks all {stats.total} phones as Not Tested again.
          </p>
          {!confirmReset ? (
            <button onClick={() => setConfirmReset(true)} style={{ ...ghostBtn, color: NAVY, border: `1.5px solid ${NAVY}` }}>
              ⟳ Start New Testing Cycle
            </button>
          ) : (
            <div style={{ background: "#fff7e6", border: "1px solid #f5d98a", borderRadius: 12, padding: 14 }}>
              <p style={{ fontFamily: "'Public Sans',sans-serif", fontSize: 13, color: "#8a6d1a", textAlign: "center", marginBottom: 10, lineHeight: 1.5 }}>
                This resets every phone to Not Tested and clears this device's saved results. <strong>Export first</strong> if you haven't sent this cycle's results to the admin console.
              </p>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setConfirmReset(false)} style={{ ...secondaryBtn, flex: 1 }}>Cancel</button>
                <button onClick={() => { onNewCycle(); setConfirmReset(false); }} style={{ ...primaryBtnSm, flex: 1.2, background: NAVY }}>Start new cycle</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- shared chrome ----------
function TopBar({ title, onBack, onHome, right }) {
  return (
    <div style={{ background: NAVY, color: "#fff", padding: "16px 14px", display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
      {onBack && <button onClick={onBack} style={iconBtn} aria-label="Back">‹</button>}
      {onHome && <button onClick={onHome} style={iconBtn} aria-label="Home">‹</button>}
      <div style={{ flex: 1, fontFamily: "'Archivo',sans-serif", fontWeight: 700, fontSize: 19, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}
        dangerouslySetInnerHTML={{ __html: title }} />
      {right}
    </div>
  );
}
